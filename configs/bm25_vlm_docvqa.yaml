  text_revision: 9a183a7237d678eaaf68dc0f640a42f46016802f
  text_json: results/vlm_ocr_docvqa/page_texts.json        # replaces the Tesseract text
  split: test

dev_only: true
system_name: "A_vlm: BM25 over Qwen3.5-4B transcription"
splits: results/splits/docvqa_split.json

latency:
