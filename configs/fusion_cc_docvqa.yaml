# POST-HOC (pre-registered 2026-11-11, after the single test run): score-level convex combination,
# after Bruch et al. (ACM TOIS 2024), who find it better than RRF for lexical + dense text retrieval.
#   fused = alpha * minmax(ColPali) + (1 - alpha) * minmax(text), min-max per query over all 500 pages.
# Same grid and rule for C_cc (BM25 text) and D_cc (BGE-M3 text): equal tuning budget, as for C vs D.
# alpha = 1.0 is ColPali alone, so "no fusion" is a possible outcome. Selection on DEV only.

colpali_scores: results/colpali_v1.3_docvqa/scores.npz

systems:
  C_cc: {name: "CC(BM25, ColPali)",   text_scores: results/bm25_docvqa/scores.npz}
  D_cc: {name: "CC(BGE-M3, ColPali)", text_scores: results/bge_m3_docvqa/scores.npz}

data:
  dataset: vidore/docvqa_test_subsampled
  revision: 49bf8f13e13c41dd8cdb0cae5314e31c1da1e0d6
  split: test

splits: results/splits/docvqa_split.json

convex_combination:
  alpha_grid: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
  normalization: minmax_per_query
  selection_metric: ndcg_at_5
  # Ties on dev: prefer alpha closest to 0.5 (the most even mix).
  tie_break: closest_to_half

output_dir: results/posthoc_extensions
