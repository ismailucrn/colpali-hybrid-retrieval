# POST-HOC set 3 test evaluation (pre-registered 2026-11-16 in e70f2a7; fourth use of the test split). Exploratory.
# H1 B_vr (visual reranker), H2 C_sel (selective fusion), H3 C_vlm (VLM transcription + BM25 + RRF), H4 E_ens.
# Settings come from the dev selections in results/posthoc3/; the script refuses any other value (frozen_check: posthoc3).

title: "POST-HOC set 3 test-split results (exploratory; main test run was 2026-11-04)"
frozen_check: posthoc3

data:
  dataset: vidore/docvqa_test_subsampled
  revision: 49bf8f13e13c41dd8cdb0cae5314e31c1da1e0d6
  split: test

splits: results/splits/docvqa_split.json
tags: results/splits/docvqa_query_tags.csv

scores:
  A: results/bm25_docvqa/scores.npz
  B: results/colpali_v1.3_docvqa/scores.npz
  A_vlm: results/bm25_vlm_docvqa/scores.npz
  Q3E: results/qwen3vl_embedding_docvqa/scores.npz
  VR: results/visual_reranker_docvqa/scores.npz      # NaN outside ColPali's top 20

component_metrics:
  A: results/bm25_docvqa/metrics.json
  B: results/colpali_v1.3_docvqa/metrics.json
  A_vlm: results/bm25_vlm_docvqa/metrics.json
  Q3E: results/qwen3vl_embedding_docvqa/metrics.json
  VR: results/visual_reranker_docvqa/metrics.json

# Order matters: gate and rerank systems use earlier systems.
systems:
  A:      {name: "A: BM25 (Tesseract text)",                       kind: single, scores: A, role: "reference"}
  B:      {name: "B: ColPali v1.3",                                kind: single, scores: B, role: "baseline"}
  A_vlm:  {name: "A_vlm: BM25 over Qwen3.5-4B transcription",      kind: single, scores: A_vlm, role: "post-hoc 3: H3 component"}
  Q3E:    {name: "Q3E: Qwen3-VL-Embedding-2B",                     kind: single, scores: Q3E, role: "post-hoc 3: H4 component"}
  C:      {name: "C: RRF(BM25, ColPali)",                          kind: rrf, inputs: [A, B], k: 1, role: "main C (frozen 2026-11-04)"}
  C_sel:  {name: "C_sel: C where BM25 margin >= tau, else B",      kind: gate, fused: C, base: B, confidence_of: A, tau: 0.5896278476550768, inputs: [A, B], role: "post-hoc 3: H2"}
  B_vr:   {name: "B_vr: ColPali top-N reranked by Qwen3-VL-Reranker-2B", kind: rerank, first: B, second: VR, n: 20, role: "post-hoc 3: H1"}
  C_vlm:  {name: "C_vlm: RRF(A_vlm, ColPali)",                     kind: rrf, inputs: [A_vlm, B], k: 1, role: "post-hoc 3: H3"}
  E_ens:  {name: "E_ens: RRF(Q3E, ColPali)",                       kind: rrf, inputs: [Q3E, B], k: 1, role: "post-hoc 3: H4"}

baseline: B
compare_to_baseline: [B_vr, C_sel, C_vlm, E_ens]       # Holm over these four
extra_pairs: [[A_vlm, A], [Q3E, B]]
pairs_title: "Pairs (post-hoc set 3): VLM transcription vs Tesseract for BM25; Qwen3-VL embedding vs ColPali"
headroom_pairs: [[A_vlm, B], [Q3E, B]]

statistics:
  metric: ndcg_at_5
  bootstrap_resamples: 10000
  permutations: 10000
  alpha: 0.05
  seed: 0
  multiple_comparisons: holm

output_dir: results/posthoc3
