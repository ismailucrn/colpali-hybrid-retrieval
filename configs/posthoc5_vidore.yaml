# POST-HOC set 5 (pre-registered 2026-11-16 in docs/experiment_log.md, before any run): does the DocVQA fusion result
# generalise to the other nine ViDoRe v1 tasks, and can a per-query router learn when to fuse?
# GPU: scripts/run_posthoc5_gpu.py (ColPali v1.3 scores, Colab L4). CPU: scripts/run_posthoc5.py --stage bm25|fusion|router.
# Nothing is tuned on these tasks: fusion settings are frozen from DocVQA dev, router settings are fixed here.

seed: 0

# base = images + queries (ColPali); text = the authors' Tesseract OCR (BM25). Revisions = Hub sha on 2026-11-16.
# card = ColPali v1.3 model card results.json (self-reported, sha b5c6dd6), nDCG@5.
tasks:
  infovqa:      {base: vidore/infovqa_test_subsampled, base_rev: f793e830aaeae1ceb8a2df626fc555b3fd04d3db,
                 text: vidore/infovqa_test_subsampled_tesseract, text_rev: 7bd56b41a40e767bba7b1467c5520c337246291c,
                 card: 0.85716, group: visual}
  arxivqa:      {base: vidore/arxivqa_test_subsampled, base_rev: b8a106812c8682bab08935cf5d1b4566c82562de,
                 text: vidore/arxivqa_test_subsampled_tesseract, text_rev: a2bc4c4616bd9247221c8cfe27851c805159d525,
                 card: 0.83037, group: visual}
  tabfquad:     {base: vidore/tabfquad_test_subsampled, base_rev: 16c8e633612fbda7400bfcbbc31d61a7534f580f,
                 text: vidore/tabfquad_test_subsampled_tesseract, text_rev: ac87e3a89b9829f55dbdf79163d05f856f2ae755,
                 card: 0.87441, group: none}
  tatdqa:       {base: vidore/tatdqa_test, base_rev: b46fea43695e14697510104a3331d9e88683a416,
                 text: vidore/tatdqa_test_tesseract, text_rev: 74e16e7580883ff1640254fdd11b1db54789b257,
                 card: 0.70361, group: text}
  shiftproject: {base: vidore/shiftproject_test, base_rev: 6e6223b3839a3f4e62d676e70a1b715ee520cc66,
                 text: vidore/shiftproject_test_tesseract, text_rev: 494949aaaf202d450ece1ae70a7e87b703f550a5,
                 card: 0.77385, group: text}
  synth_energy: {base: vidore/syntheticDocQA_energy_test, base_rev: a2f2f358463b03b84506849460ab5094a358526c,
                 text: vidore/syntheticDocQA_energy_test_tesseract, text_rev: 2ae81641b592eb99387af754f4db203f01815b42,
                 card: 0.95405, group: text}
  synth_ai:     {base: vidore/syntheticDocQA_artificial_intelligence_test, base_rev: 5694fec64c57f7380f918435f9234b96d817b82a,
                 text: vidore/syntheticDocQA_artificial_intelligence_test_tesseract, text_rev: 9d6880f4f97a5e4726b18b6ab600bb136bda3cd0,
                 card: 0.97431, group: text}
  synth_gov:    {base: vidore/syntheticDocQA_government_reports_test, base_rev: 91cf66572d89c9cccac0661de227acaf04b44f64,
                 text: vidore/syntheticDocQA_government_reports_test_tesseract, text_rev: 3ed3f98776924e5bb2a9f8debea393a9dd91d789,
                 card: 0.96216, group: text}
  synth_health: {base: vidore/syntheticDocQA_healthcare_industry_test, base_rev: d973f3da3e60c8eaf566efa2f7d2a1515cba40ed,
                 text: vidore/syntheticDocQA_healthcare_industry_test_tesseract, text_rev: 3a85d938890112cadddd115150962192e7ef412f,
                 card: 0.96911, group: text}

# DocVQA is used by the router only (as a training task, and as a held-out task flagged "reused test split").
docvqa:
  base: vidore/docvqa_test_subsampled
  base_rev: 49bf8f13e13c41dd8cdb0cae5314e31c1da1e0d6
  A: results/bm25_docvqa/scores.npz
  B: results/colpali_v1.3_docvqa/scores.npz

colpali:   # same model, revisions and code path as the InfoVQA run of set 4 (which reproduced the card)
  family: colpali_engine
  model: vidore/colpali-v1.3
  revision: b5c6dd62125326e6f0b540c1f7b36e901cdc0a11
  base_revision: 30ab955d073de4a91dc5a288e8c97226647e3e5a
  model_class: ColPali
  processor_class: ColPaliProcessor
  batch_size: 4
  output_dir: results/colpali_v1.3_{task}      # infovqa already exists (set 4) and is reused

bm25:
  tokenizer: official          # vidore-benchmark BM25Retriever (English NLTK stopwords, also on French tasks)
  output_dir: results/bm25_{task}

fusion:   # frozen from DocVQA dev (configs/test_evaluation.yaml); never tuned here
  C:   {kind: rrf, inputs: [A, B], k: 1}
  C_w: {kind: wrrf, inputs: [B, A], weights: [0.95, 0.05], k: 20}
  k_grid_descriptive: [1, 5, 10, 20, 40, 60, 80, 100, 200, 500]   # descriptive only, never used to pick anything

router:
  between: [B, C]                # route each query to ColPali alone or to C
  model: logistic_regression     # sklearn LogisticRegression(C=1.0, max_iter=1000), StandardScaler fitted on training rows
  label: "1 if nDCG@5(C) > nDCG@5(B); 0 if lower; ties dropped from training (they do not change the outcome)"
  sample_weight: equal total weight per training task
  threshold: 0.5                 # route to C if P(C better) >= 0.5
  evaluation: leave-one-task-out over the 9 tasks + DocVQA (10 folds)
  features: [b_rel_margin, a_rel_margin, b_top_z, a_top_z, log_rank_of_a_top1_in_b, top5_overlap, log_query_len, digit_share]

output_dir: results/posthoc5
