# POST-HOC set 3 (pre-registered 2026-11-16 in e70f2a7, after the main test run and post-hoc sets 1-2). Exploratory.
# H1 visual reranker on ColPali's top N; H2 selective fusion; H3 VLM transcription -> BM25 -> RRF; H4 Qwen3-VL embedding.
# GPU stages (Colab L4): scripts/run_posthoc3_gpu.py --stage embed|rerank|ocr. Dev selection: scripts/run_posthoc3_dev.py.

data:
  dataset: vidore/docvqa_test_subsampled
  revision: 49bf8f13e13c41dd8cdb0cae5314e31c1da1e0d6
  split: test

splits: results/splits/docvqa_split.json
seed: 0

scores:
  A: results/bm25_docvqa/scores.npz
  B: results/colpali_v1.3_docvqa/scores.npz

# H1: Qwen3-VL-Reranker-2B on (question, page image) for ColPali's top `pool_top` pages of every query.
reranker:
  model: Qwen/Qwen3-VL-Reranker-2B
  revision: 4bd860ac4f15ad1897a214615cccc700f8f71818
  instruction: "Given a question, retrieve the document page image that answers it."
  pool_first: B
  pool_top: 20
  batch_size: 4
  dtype: bfloat16
  latency: {n_queries: 20, n_values: [5, 10, 20]}
  output_dir: results/visual_reranker_docvqa
  n_grid: [1, 5, 10, 20]          # N = 1: no reranking (= B)
  tie_break: smaller_n

# H2: selective fusion: C = RRF(BM25, ColPali) with the frozen main k when BM25's relative top-2 margin >= tau.
selective:
  fused: {inputs: [A, B], k: 1}   # the main C (k selected on dev on 2026-11-04)
  confidence_of: A
  tau_quantiles: [0.5, 0.75, 0.9, 0.95, 0.99]   # dev quantiles of the confidence; plus +inf (never fuse)
  tie_break: larger_tau

# H3: VLM transcription of every page, then BM25 (official tokenizer) and RRF(A_vlm, ColPali).
ocr:
  model: Qwen/Qwen3.5-4B
  revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  fallback_model: Qwen/Qwen3-VL-4B-Instruct
  fallback_revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  prompt: "Transcribe all text on this page in natural reading order as plain text. Output only the text."
  max_new_tokens: 2048
  temperature: 0.0
  max_model_len: 16384
  output_dir: results/vlm_ocr_docvqa
  bm25_output_dir: results/bm25_vlm_docvqa

# H4: Qwen3-VL-Embedding-2B over page images (single vector, cosine).
embedding:
  model: Qwen/Qwen3-VL-Embedding-2B
  revision: 9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda
  query_instruction: "Retrieve the document page image that answers the question."
  batch_size: 8
  dtype: bfloat16
  output_dir: results/qwen3vl_embedding_docvqa

rrf:
  k_grid: [1, 5, 10, 20, 40, 60, 80, 100, 200, 500]
  tie_break: closest_to_60

output_dir: results/posthoc3
